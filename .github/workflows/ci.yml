name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore NVibrance.slnx

      - name: Build
        run: dotnet build NVibrance.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NVibrance.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: TestResults

      # Build and try the installer exactly as a release would, so packaging problems
      # (a Velopack bump from Dependabot, a renamed exe, a crashing install hook) show up
      # on the pull request instead of when a release tag is pushed.
      - name: Package installer
        run: ./.github/scripts/package.ps1 -Version "0.0.1-ci.${{ github.run_number }}"

      - name: Smoke-test installer
        run: ./.github/scripts/smoke-test-installer.ps1 -Version "0.0.1-ci.${{ github.run_number }}"

      # the installer from this run, to try a pull request's build by hand
      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NVibrance-Setup-ci.${{ github.run_number }}
          path: NVibrance-Setup.exe
          retention-days: 7
