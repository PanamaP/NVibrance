name: Build & Release (Windows x64)

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# Actions are pinned to full commit SHAs, not tags: a tag can be moved to different code, and
# this workflow publishes what every installed copy of NVibrance downloads as an update.
jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Tag is like v1.1.0; MSBuild wants 1.1.0
      - name: Resolve version from tag
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION=$version"

      - name: Restore
        run: dotnet restore NVibrance.slnx

      - name: Build
        run: dotnet build NVibrance.slnx -c Release --no-restore

      - name: Test
        run: dotnet test NVibrance.slnx -c Release --no-build

      # Same script as CI, plus the previous release's package so this one ships a delta update
      - name: Package installer
        run: ./.github/scripts/package.ps1 -Version $env:VERSION -PreviousReleaseRepo "https://github.com/${{ github.repository }}" -Token "${{ secrets.GITHUB_TOKEN }}"

      # never publish an installer that doesn't install, start and uninstall cleanly
      - name: Smoke-test installer
        run: ./.github/scripts/smoke-test-installer.ps1 -Version $env:VERSION

      # -------- Release --------
      # GitHub's own CLI (preinstalled on the runner) rather than a third-party action:
      # this step publishes what installed copies update to.
      # Only this version's packages are attached; the previous one downloaded for the
      # delta already lives on its own release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(
            'NVibrance-Setup.exe'
            'NVibrance-Portable.zip'
            'releases/releases.win.json'
            'releases/assets.win.json'
            'releases/RELEASES'
          ) + (Get-ChildItem "releases/*-$env:VERSION-*.nupkg").FullName  # full, plus delta when there is one
          gh release create "${{ github.ref_name }}" @files --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
